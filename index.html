<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>漢字喫茶 - Cozy Kanji Café</title>
    <style>
        :root {
            --cafe-bg: #f4eee2;
            --cafe-card: #ffffff;
            --cafe-wood: #5c4033;
            --cafe-accent: #8b5a2b;
            --cafe-text: #2f2e2e;
            --cafe-gold: #d4a373;
            --counter-bg: linear-gradient(135deg, #e9edc9 0%, #ccd5ae 100%);
        }

        body.theme-sakura {
            --cafe-bg: #ffe5ec;
            --cafe-card: #ffffff;
            --cafe-wood: #6b2d5c;
            --cafe-accent: #ffb703;
            --counter-bg: linear-gradient(135deg, #ffcad4 0%, #ffb5a7 100%);
        }

        body.theme-rainy {
            --cafe-bg: #d8e2dc;
            --cafe-card: #f8f9fa;
            --cafe-wood: #2b2d42;
            --cafe-accent: #4a4e69;
            --counter-bg: linear-gradient(135deg, #94d2bd 0%, #e9d8a6 100%);
        }

        body.theme-autumn {
            --cafe-bg: #fdf0ed;
            --cafe-card: #ffffff;
            --cafe-wood: #9e2a2b;
            --cafe-accent: #e07a5f;
            --counter-bg: linear-gradient(135deg, #f4a261 0%, #e76f51 100%);
        }

        body.theme-night {
            --cafe-bg: #1d2d44;
            --cafe-card: #0d1b2a;
            --cafe-wood: #f4a261;
            --cafe-text: #e0e1dd;
            --cafe-gold: #e07a5f;
            --counter-bg: linear-gradient(135deg, #415a77 0%, #1b263b 100%);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 10px;
            background-color: var(--cafe-bg);
            color: var(--cafe-text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.4s ease;
        }

        #game-box {
            width: 100%;
            max-width: 480px;
            background: var(--cafe-card);
            border: 4px solid var(--cafe-wood);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
            position: relative;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed rgba(212, 163, 115, 0.5);
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        h1 {
            margin: 0;
            font-size: 18px;
            color: var(--cafe-wood);
        }

        .header-btns {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: var(--cafe-accent);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(250, 237, 205, 0.6);
            padding: 8px 12px;
            border-radius: 10px;
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: bold;
            color: var(--cafe-wood);
        }

        .theme-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.05);
            border-radius: 10px;
            padding: 5px;
            margin-bottom: 12px;
        }

        .theme-btn {
            background: transparent;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .theme-btn.active {
            background: var(--cafe-card);
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .shop-counter {
            position: relative;
            height: 160px;
            background: var(--counter-bg);
            border-radius: 12px;
            border: 2px solid var(--cafe-gold);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            margin-bottom: 12px;
            text-align: center;
            transition: background 0.4s ease;
        }

        .customer-avatar {
            font-size: 45px;
            margin-bottom: 5px;
            animation: bounce 1.5s infinite alternate;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-5px); }
        }

        .order-bubble {
            background: var(--cafe-card);
            color: var(--cafe-text);
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 13px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            border: 1px solid var(--cafe-gold);
            max-width: 90%;
        }

        .order-kanji {
            font-size: 32px;
            font-weight: bold;
            color: var(--cafe-wood);
            letter-spacing: 2px;
            margin: 2px 0;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .btn-opt {
            background: var(--cafe-card);
            color: var(--cafe-text);
            border: 2px solid var(--cafe-gold);
            padding: 12px 8px;
            font-size: 14px;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            transition: all 0.1s;
        }

        .btn-opt:active {
            transform: scale(0.96);
            background: var(--cafe-gold);
            color: white;
        }

        .mode-selector {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(0,0,0,0.08);
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            color: var(--cafe-wood);
        }

        .filter-btn.active {
            background: var(--cafe-wood);
            color: white;
        }

        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20, 20, 20, 0.95);
            border-radius: 20px;
            padding: 15px;
            z-index: 10;
            overflow-y: auto;
            color: white;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--cafe-gold);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .dict-search {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--cafe-gold);
            margin-bottom: 10px;
            font-size: 13px;
        }

        .vocab-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px;
            border-bottom: 1px dashed rgba(255,255,255,0.15);
            font-size: 13px;
        }

        .vocab-badge {
            background: var(--cafe-gold);
            color: #2f2e2e;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            margin-left: 5px;
        }

        .close-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .hint-box {
            background: var(--cafe-card);
            color: var(--cafe-text);
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            border: 3px solid var(--cafe-gold);
            text-align: center;
        }

        .hint-kanji {
            font-size: 40px;
            color: var(--cafe-wood);
            font-weight: bold;
        }

        .hint-decomp {
            background: rgba(0,0,0,0.05);
            padding: 6px;
            border-radius: 6px;
            font-size: 13px;
            margin: 8px 0;
            color: var(--cafe-accent);
            font-weight: bold;
        }

        .hint-story {
            font-size: 13px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div id="game-box">
    <header>
        <h1>☕ 漢字喫茶 (Kanji Café)</h1>
        <div class="header-btns">
            <button class="icon-btn" onclick="toggleDict()">📖 စာအုပ်စင် (<span id="total-dict-count">0</span>)</button>
        </div>
    </header>

    <div class="theme-bar">
        <button class="theme-btn active" title="Default Cozy" onclick="changeTheme('default', this)">☕ Cozy</button>
        <button class="theme-btn" title="Sakura Spring" onclick="changeTheme('sakura', this)">🌸 Sakura</button>
        <button class="theme-btn" title="Rainy Day" onclick="changeTheme('rainy', this)">🌧️ Rainy</button>
        <button class="theme-btn" title="Autumn Tea House" onclick="changeTheme('autumn', this)">🍂 Autumn</button>
        <button class="theme-btn" title="Cozy Night" onclick="changeTheme('night', this)">🌙 Night</button>
    </div>

    <div class="stats-bar">
        <span>🪙 ငွေပြား: <strong id="coin-val" style="color: #b5838d;">0</strong></span>
        <span>⭐ အမှတ်: <strong id="score-val" style="color: #e09f3e;">0</strong></span>
        <span>☕ အဆင့်: <span id="level-name">အစပြုဆိုင်</span></span>
    </div>

    <div class="mode-selector">
        <button class="filter-btn active" onclick="setFilter('ALL')">အားလုံး</button>
        <button class="filter-btn" onclick="setFilter('N5')">N5</button>
        <button class="filter-btn" onclick="setFilter('N4')">N4</button>
        <button class="filter-btn" onclick="setFilter('SINGLE')">တစ်လုံးချင်း</button>
        <button class="filter-btn" onclick="setFilter('JUKUGO')">တွဲလုံးများ</button>
    </div>

    <div class="shop-counter">
        <div class="customer-avatar" id="cust-avatar">🦊</div>
        <div class="order-bubble">
            <span id="order-text">ဒီ မီနူးလေး လိုချင်ပါတယ်:</span>
            <div id="kanji-display" class="order-kanji">準備中...</div>
        </div>
    </div>

    <div class="options-grid" id="options-box"></div>

    <!-- Mnemonic Hint Modal -->
    <div id="hint-modal" class="modal">
        <div class="modal-header">
            <span>💡 အလွယ်မှတ်နည်း အကွက်</span>
            <button class="close-btn" onclick="closeHint()">ဆက်လုပ်မည်</button>
        </div>
        <div class="hint-box">
            <div class="hint-kanji" id="hint-k-display">山</div>
            <div id="hint-reading" style="font-weight: bold; color: var(--cafe-wood);">[やま] - တောင်</div>
            <div class="hint-decomp" id="hint-decomp-text">ခွဲခြားပုံ: ｜ + 𠁁</div>
            <div class="hint-story" id="hint-story-text">မှတ်နည်း: တောင်ထွတ် ၃ ခု ထောင်ထွက်နေသော ပုံစံမှ ဆင်းသက်လာသည်။</div>
        </div>
    </div>

    <!-- Expanded Dictionary Modal -->
    <div id="dict-modal" class="modal">
        <div class="modal-header">
            <span>📚 N5 & N4 စာအုပ်စင် အပြည့်အစုံ</span>
            <button class="close-btn" onclick="toggleDict()">ပိတ်မည်</button>
        </div>
        <input type="text" class="dict-search" id="dict-search-input" placeholder="ခန်းဂျီး၊ အသံထွက် သို့မဟုတ် အဓိပ္ပာယ် ရှာရန်..." oninput="renderDict()">
        <div id="dict-list"></div>
    </div>
</div>

<script>
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if(ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if(type === 'coin') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1000, ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.15);
            osc.start(); osc.stop(ctx.currentTime + 0.15);
        } else if(type === 'error') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(80, ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.2);
            osc.start(); osc.stop(ctx.currentTime + 0.2);
        }
    }

    function changeTheme(themeName, btn) {
        document.body.className = '';
        if(themeName !== 'default') {
            document.body.classList.add('theme-' + themeName);
        }
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

        { k: "説明", r: "せつめい", m: "ရှင်းလင်းချက်", l: "N4", type: "JUKUGO", decomp: "説 + 明", story: "နားလည်အောင် ရှင်းပြခြင်း။" }
    ];

    const customers = ["🦊", "🐼", "🐨", "🐰", "🐱", "🐻", "🐸", "🐯"];
    let currentFilter = 'ALL';
    let coins = 0;
    let score = 0;
    let curTarget = {};
    let sessionQueue = [];

    function setFilter(filter) {
        currentFilter = filter;
        sessionQueue = [];
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        nextCustomer();
    }

    function getFilteredPool() {
        return masterDb.filter(item => {
            if (currentFilter === 'ALL') return true;
            if (currentFilter === 'N5') return item.l === 'N5';
            if (currentFilter === 'N4') return item.l === 'N4';
            if (currentFilter === 'SINGLE') return item.type === 'SINGLE';
            if (currentFilter === 'JUKUGO') return item.type === 'JUKUGO';
            return true;
        });
    }

    function nextCustomer() {
        const pool = getFilteredPool();
        if(pool.length === 0) return;

        if(sessionQueue.length === 0) {
            sessionQueue = [...pool];
            sessionQueue.sort(() => Math.random() - 0.5);
        }

        curTarget = sessionQueue.pop();
        
        document.getElementById('cust-avatar').innerText = customers[Math.floor(Math.random() * customers.length)];
        document.getElementById('kanji-display').innerText = curTarget.k;

        let choices = [curTarget];
        while(choices.length < 4 && choices.length < pool.length) {
            let r = pool[Math.floor(Math.random() * pool.length)];
            if(!choices.includes(r)) choices.push(r);
        }
        choices.sort(() => Math.random() - 0.5);

        const box = document.getElementById('options-box');
        box.innerHTML = '';
        choices.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'btn-opt';
            btn.innerHTML = `<strong>${c.r}</strong><br><span style="font-size:11px; opacity: 0.8;">${c.m}</span>`;
            btn.onclick = () => checkAnswer(c === curTarget);
            box.appendChild(btn);
        });
    }

    function checkAnswer(correct) {
        if(correct) {
            playSound('coin');
            coins += 10;
            score += 1;
            updateStats();
            nextCustomer();
        } else {
            playSound('error');
            showHint();
        }
    }

    function showHint() {
        document.getElementById('hint-k-display').innerText = curTarget.k;
        document.getElementById('hint-reading').innerText = `[${curTarget.r}] - ${curTarget.m}`;
        document.getElementById('hint-decomp-text').innerText = `ခွဲခြားပုံ: ${curTarget.decomp || 'အစိတ်အပိုင်း စာလုံးများ'}`;
        document.getElementById('hint-story-text').innerText = `မှတ်နည်း: ${curTarget.story || 'အသံထွက်နှင့် အဓိပ္ပာယ်ကို တွဲဖက်မှတ်သားပါ'}`;
        document.getElementById('hint-modal').style.display = 'block';
    }

    function closeHint() {
        document.getElementById('hint-modal').style.display = 'none';
        nextCustomer();
    }

    function updateStats() {
        document.getElementById('coin-val').innerText = coins;
        document.getElementById('score-val').innerText = score;
        
        let lvl = "အစပြုဆိုင်";
        if(score >= 10) lvl = "နာမည်ကြီးကဖီး";
        if(score >= 25) lvl = "ဇိမ်ခံကဖီးဆိုင်";
        if(score >= 50) lvl = "မာစတာကဖီးဆိုင်";
        document.getElementById('level-name').innerText = lvl;
    }

    function toggleDict() {
        const modal = document.getElementById('dict-modal');
        if(modal.style.display === 'block') {
            modal.style.display = 'none';
        } else {
            modal.style.display = 'block';
            renderDict();
        }
    }

    function renderDict() {
        const query = document.getElementById('dict-search-input').value.toLowerCase();
        const list = document.getElementById('dict-list');
        list.innerHTML = '';
        
        const filtered = masterDb.filter(item => 
            item.k.includes(query) || 
            item.r.toLowerCase().includes(query) || 
            item.m.toLowerCase().includes(query)
        );

        filtered.forEach(item => {
            const div = document.createElement('div');
            div.className = 'vocab-row';
            div.innerHTML = `
                <div>
                    <strong>${item.k}</strong> (${item.r}) 
                    <span class="vocab-badge">${item.l}</span>
                    <span class="vocab-badge" style="background:#e3d5ca;">${item.type === 'SINGLE' ? 'တစ်လုံး' : 'တွဲလုံး'}</span>
                </div>
                <div style="color: #ffd166;">${item.m}</div>
            `;
            list.appendChild(div);
        });
    }

    document.getElementById('total-dict-count').innerText = masterDb.length;
    nextCustomer();
</script>
</body>
</html>
